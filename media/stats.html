<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP_SOURCE}} 'unsafe-inline'; script-src 'nonce-{{NONCE}}';">
  <link rel="stylesheet" href="{{STYLE_URI}}">
  <title>ショートカット利用統計</title>
</head>
<body>
  <div class="dashboard">
    <!-- トップヘッダー: タイトル & モード切替 -->
    <header class="top-header">
      <div class="brand-area">
        <h1 class="app-title">ショートカット利用統計</h1>
        <div id="last-key-pill" class="last-key-pill" title="直前に追跡されたショートカット">
          <span class="last-key-label">直前:</span>
          <span id="last-key-content" class="last-key-value">(なし)</span>
        </div>
      </div>

      <div class="header-right">
        <nav class="mode-tabs" role="tablist" aria-label="表示モード切替">
          <button
            type="button"
            id="mode-tab-global"
            class="mode-tab active"
            role="tab"
            aria-selected="true"
            data-action="switch-mode"
            data-mode="global"
          >
            <span>累計統計</span>
            <span id="badge-global-count" class="tab-badge">0</span>
          </button>
          <button
            type="button"
            id="mode-tab-session"
            class="mode-tab"
            role="tab"
            aria-selected="false"
            data-action="switch-mode"
            data-mode="session"
          >
            <span>セッション計測</span>
            <span id="badge-session-status" class="tab-badge">停止中</span>
          </button>
        </nav>

        <button
          type="button"
          class="btn btn-ghost icon-btn"
          data-action="refresh"
          title="統計を手動更新"
        >
          ↻ 更新
        </button>
      </div>
    </header>

    <!-- セッション専用コントロールバー (セッションモード時のみ表示) -->
    <section id="session-hero" class="session-hero hidden" aria-label="セッション計測操作">
      <div class="session-hero-main">
        <div class="session-state-group">
          <span id="session-live-badge" class="live-status-badge inactive">
            <span class="pulse-dot"></span>
            <span id="session-live-text">停止中</span>
          </span>
          <div class="session-timer-block">
            <span class="meta-label">経過時間</span>
            <span id="session-duration" class="session-timer-value">0秒</span>
          </div>
          <div class="session-meta-divider"></div>
          <div class="session-meta-item">
            <span class="meta-label">開始日時</span>
            <span id="session-started-at" class="meta-value">(未開始)</span>
          </div>
          <div class="session-meta-item">
            <span class="meta-label">初期キーバインド</span>
            <span id="session-snapshot-info" class="meta-value">未保存</span>
          </div>
        </div>

        <div class="session-hero-actions">
          <button
            type="button"
            id="btn-session-toggle"
            class="btn btn-primary"
            data-action="toggle-session"
          >
            ▶ 計測を開始
          </button>
          <button
            type="button"
            class="btn btn-secondary"
            data-action="export-session-dir"
            title="セッション統計・差分・初期キーバインドをローカルフォルダに保存"
          >
            💾 フォルダに保存
          </button>
          <button
            type="button"
            class="btn btn-danger-outline"
            data-action="reset-session"
            title="セッション計測データのみをリセット（累計統計には影響しません）"
          >
            リセット
          </button>
        </div>
      </div>
    </section>

    <!-- KPI サマリーカード (現在選択中のモード・拡張子フィルタに連動) -->
    <section class="kpi-grid" aria-label="集計サマリー">
      <div class="kpi-card">
        <div class="kpi-label" id="kpi-title-total">総入力回数 (全入力)</div>
        <div class="kpi-value-row">
          <span id="kpi-total-inputs" class="kpi-value">0</span>
          <span class="kpi-unit">回</span>
        </div>
        <div id="kpi-sub-total" class="kpi-sub">連続打鍵を含む実行回数</div>
      </div>

      <div class="kpi-card">
        <div class="kpi-label">非連続入力回数</div>
        <div class="kpi-value-row">
          <span id="kpi-non-consecutive" class="kpi-value">0</span>
          <span class="kpi-unit">回</span>
        </div>
        <div id="kpi-sub-non-consecutive" class="kpi-sub">同一キー連続入力を1回として集計</div>
      </div>

      <div class="kpi-card">
        <div class="kpi-label">連続リピート率</div>
        <div class="kpi-value-row">
          <span id="kpi-repeat-rate" class="kpi-value">0.0</span>
          <span class="kpi-unit">%</span>
        </div>
        <div class="kpi-meter-track">
          <div id="kpi-repeat-bar" class="kpi-meter-fill"></div>
        </div>
        <div id="kpi-sub-repeat" class="kpi-sub">連続打鍵: 0 回</div>
      </div>

      <div class="kpi-card">
        <div class="kpi-label" id="kpi-title-unique">登録項目 / 最頻出</div>
        <div class="kpi-value-row">
          <span id="kpi-unique-count" class="kpi-value">0</span>
          <span id="kpi-unique-unit" class="kpi-unit">種類</span>
        </div>
        <div id="kpi-sub-top" class="kpi-sub truncate">最頻出: -</div>
      </div>
    </section>

    <!-- セッション キーバインド変更差分アコーディオン (セッションモードかつ差分データ存在時のみ表示) -->
    <section id="diff-section" class="diff-accordion hidden" aria-label="キーバインド変更差分">
      <div class="diff-header">
        <button
          type="button"
          id="diff-toggle-btn"
          class="diff-toggle-btn"
          data-action="toggle-diff-accordion"
          aria-expanded="false"
        >
          <span id="diff-chevron" class="chevron">▸</span>
          <span class="diff-title">キーバインドの変更差分</span>
          <span id="diff-summary-badges" class="diff-badges-group"></span>
        </button>

        <div class="diff-header-actions">
          <button
            type="button"
            id="btn-copy-diff-json"
            class="btn btn-secondary btn-sm"
            data-action="copy-diff-json"
          >
            📋 差分JSONコピー
          </button>
        </div>
      </div>

      <div id="diff-body" class="diff-body hidden">
        <div id="diff-empty-msg" class="diff-empty-msg hidden">
          セッション開始時からキーバインド設定の変更はありませんでした（開始時と同一）。
        </div>

        <div id="diff-content-wrap">
          <div class="diff-filter-bar">
            <span class="filter-caption">種別フィルタ:</span>
            <div class="segmented-control" id="diff-filter-group">
              <button type="button" class="seg-btn active" data-action="filter-diff" data-diff-type="all">すべて</button>
              <button type="button" class="seg-btn" data-action="filter-diff" data-diff-type="added">追加</button>
              <button type="button" class="seg-btn" data-action="filter-diff" data-diff-type="modified">変更</button>
              <button type="button" class="seg-btn" data-action="filter-diff" data-diff-type="removed">削除</button>
            </div>
          </div>

          <div class="diff-table-scroll">
            <table class="data-table diff-table">
              <thead>
                <tr>
                  <th class="col-diff-type">種別</th>
                  <th class="col-diff-key">キー</th>
                  <th>変更詳細</th>
                </tr>
              </thead>
              <tbody id="diff-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <!-- ファイル拡張子別フィルタチップ -->
    <section id="ext-filter-bar" class="ext-filter-bar" aria-label="ファイル拡張子フィルタ">
      <div class="ext-filter-header">
        <span class="filter-caption">拡張子フィルタ:</span>
        <button
          type="button"
          id="ext-clear-btn"
          class="link-btn hidden"
          data-action="clear-ext-filter"
        >
          選択解除
        </button>
      </div>
      <div id="ext-chips-container" class="ext-chips"></div>
    </section>

    <!-- 検索・グルーピング・エクスポート操作ツールバー -->
    <section class="toolbar-row" aria-label="テーブル操作ツールバー">
      <div class="toolbar-left">
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="コマンド名・キーで絞り込み (/ でフォーカス)..."
            autocomplete="off"
            spellcheck="false"
          />
          <span id="search-count-badge" class="search-count-badge hidden"></span>
          <button
            type="button"
            id="search-clear-btn"
            class="search-clear-btn hidden"
            data-action="clear-search"
            title="検索条件をクリア (Esc)"
          >
            ✕
          </button>
        </div>

        <div class="segmented-control" role="group" aria-label="集計単位の切替">
          <button
            type="button"
            id="group-btn-command"
            class="seg-btn active"
            data-action="set-grouping"
            data-group-mode="command"
            title="記録されたコマンド＋キー単位で一覧表示します"
          >
            コマンド別
          </button>
          <button
            type="button"
            id="group-btn-key"
            class="seg-btn"
            data-action="set-grouping"
            data-group-mode="key"
            title="同じ物理キー（例: alt+j）に割り当てられた複数コマンドの打鍵数を合算し、内訳を展開確認できます"
          >
            物理キー合算
          </button>
        </div>
      </div>

      <div class="toolbar-right">
        <!-- TSVコピー（スプリットボタン＋フォーマット選択メニュー） -->
        <div class="split-btn-wrap" id="tsv-menu-container">
          <button
            type="button"
            class="btn btn-secondary split-main"
            data-action="copy-tsv-now"
            title="現在の表示条件・並び順のままTSV形式でクリップボードにコピー"
          >
            <span>📊 TSVコピー</span>
            <span id="tsv-format-hint" class="btn-sub-tag">統合</span>
          </button>
          <button
            type="button"
            class="btn btn-secondary split-trigger"
            data-action="toggle-tsv-menu"
            aria-haspopup="true"
            aria-expanded="false"
            title="TSVの出力形式を選択"
          >
            ▾
          </button>
          <div id="tsv-dropdown" class="dropdown-menu hidden" role="menu">
            <div class="dropdown-header">現在の絞り込み・並び順で即コピー</div>
            <button type="button" class="dropdown-item" data-action="select-tsv-format" data-tsv-format="unified">
              <span class="check-mark" id="check-tsv-unified">✓</span>
              <div class="dropdown-item-body">
                <div class="dropdown-item-title">統合形式 (推奨・AI分析向け)</div>
                <div class="dropdown-item-desc">キー / 全入力 / 全入力% / 非連続 / 非連続% / リピート率</div>
              </div>
            </button>
            <button type="button" class="dropdown-item" data-action="select-tsv-format" data-tsv-format="raw">
              <span class="check-mark" id="check-tsv-raw"></span>
              <div class="dropdown-item-body">
                <div class="dropdown-item-title">従来形式: 全入力のみ (3列)</div>
                <div class="dropdown-item-desc">キー / 回数 / パーセント</div>
              </div>
            </button>
            <button type="button" class="dropdown-item" data-action="select-tsv-format" data-tsv-format="dedup">
              <span class="check-mark" id="check-tsv-dedup"></span>
              <div class="dropdown-item-body">
                <div class="dropdown-item-title">従来形式: 非連続のみ (3列)</div>
                <div class="dropdown-item-desc">キー / 回数 / パーセント</div>
              </div>
            </button>
            <button type="button" class="dropdown-item" data-action="select-tsv-format" data-tsv-format="both">
              <span class="check-mark" id="check-tsv-both"></span>
              <div class="dropdown-item-body">
                <div class="dropdown-item-title">従来形式: 全入力＋非連続の2表</div>
                <div class="dropdown-item-desc">2ブロックに分けて出力</div>
              </div>
            </button>
            <div class="dropdown-divider"></div>
            <button type="button" class="dropdown-item" data-action="open-tsv-quickpick">
              <span class="check-mark"></span>
              <div class="dropdown-item-body">
                <div class="dropdown-item-title">ダイアログで拡張子を選んでコピー...</div>
              </div>
            </button>
          </div>
        </div>

        <button
          type="button"
          class="btn btn-secondary"
          data-action="copy-json"
          title="拡張子別の構造化JSONデータをクリップボードにコピー"
        >
          📋 JSONコピー
        </button>

        <div id="global-actions-group" class="inline-actions">
          <button
            type="button"
            class="btn btn-secondary"
            data-action="import-json"
            title="JSON形式の統計データをインポートして合算"
          >
            📥 インポート
          </button>
          <button
            type="button"
            class="btn btn-danger-outline"
            data-action="reset-global"
            title="累計統計データをすべて削除"
          >
            🗑️ 削除
          </button>
        </div>
      </div>
    </section>

    <!-- 統合ソート対応ランキングテーブル -->
    <section class="table-container" aria-label="ショートカット使用ランキング">
      <table class="data-table ranking-table">
        <thead>
          <tr>
            <th class="col-rank">#</th>
            <th class="col-shortcut sortable" data-action="sort-column" data-sort-key="key">
              <span class="th-inner">
                <span>ショートカット / コマンド</span>
                <span class="sort-indicator" id="sort-ind-key"></span>
              </span>
            </th>
            <th class="col-metric sortable" data-action="sort-column" data-sort-key="total">
              <span class="th-inner right">
                <span>全入力 (回数・割合)</span>
                <span class="sort-indicator" id="sort-ind-total">↓</span>
              </span>
            </th>
            <th class="col-metric sortable" data-action="sort-column" data-sort-key="nonConsecutive">
              <span class="th-inner right">
                <span>非連続 (回数・割合)</span>
                <span class="sort-indicator" id="sort-ind-nonConsecutive"></span>
              </span>
            </th>
            <th class="col-rate sortable" data-action="sort-column" data-sort-key="repeatRate">
              <span class="th-inner right">
                <span>リピート率</span>
                <span class="sort-indicator" id="sort-ind-repeatRate"></span>
              </span>
            </th>
          </tr>
        </thead>
        <tbody id="ranking-tbody"></tbody>
      </table>
    </section>
  </div>

  <!-- 初期データ埋め込み（初回描画ラグ防止） -->
  <script id="initial-data" type="application/json" nonce="{{NONCE}}">{{INITIAL_JSON}}</script>
  <script nonce="{{NONCE}}" src="{{SCRIPT_URI}}"></script>
</body>
</html>
